
services:
  backend:
    build:
      context: ./backend
    container_name: shopsphere-backend
    env_file:
      - ./backend/.env
    ports:
      - "5001:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: shopsphere-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped
